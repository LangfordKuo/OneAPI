name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Ensure tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${version}"
            exit 1
          fi

  web:
    name: Build web assets
    needs: validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  build:
    name: Build ${{ matrix.platform }}
    needs:
      - validate
      - web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            platform: linux-amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            platform: linux-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            platform: windows-amd64
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            platform: windows-arm64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            platform: macos-amd64
          - target: aarch64-apple-darwin
            os: macos-15
            platform: macos-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools musl-dev

      - name: Build release binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Upload the raw executable. The final tar.gz/zip is assembled once in the
      # release job, so no archive ever contains another archive.
      - uses: actions/upload-artifact@v7
        if: runner.os != 'Windows'
        with:
          name: oneapi-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/oneapi
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: oneapi-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/oneapi.exe
          if-no-files-found: error

  docker:
    name: Docker (linux/amd64, linux/arm64)
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: oneapi-linux-*
          path: docker-artifacts

      - name: Prepare Linux binaries
        run: |
          set -euo pipefail
          mkdir -p docker-context/amd64 docker-context/arm64
          cp docker-artifacts/oneapi-linux-amd64/oneapi docker-context/amd64/oneapi
          cp docker-artifacts/oneapi-linux-arm64/oneapi docker-context/arm64/oneapi
          chmod +x docker-context/amd64/oneapi docker-context/arm64/oneapi
          file docker-context/amd64/oneapi docker-context/arm64/oneapi

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=sha

      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate
      - build
      - docker
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: oneapi-*
          path: artifacts

      - name: Package release archives
        run: |
          set -euo pipefail
          mkdir -p out

          package_platform() {
            platform="$1"
            binary="$2"
            archive_type="$3"
            stage="stage/$platform"
            mkdir -p "$stage"
            cp "artifacts/oneapi-$platform/$binary" "$stage/"
            cp README.md LICENSE .env.example "$stage/"
            if [ "$archive_type" = "zip" ]; then
              python3 -c 'import os,sys,zipfile; stage=sys.argv[1]; dest=sys.argv[2]; z=zipfile.ZipFile(dest,"w",zipfile.ZIP_DEFLATED); [z.write(os.path.join(stage,n),n) for n in sorted(os.listdir(stage))]; z.close()' "$stage" "$GITHUB_WORKSPACE/out/oneapi-${GITHUB_REF_NAME}-$platform.zip"
            else
              tar -czf "out/oneapi-${GITHUB_REF_NAME}-$platform.tar.gz" -C "$stage" .
            fi
          }

          package_platform linux-amd64 oneapi tar
          package_platform linux-arm64 oneapi tar
          package_platform windows-amd64 oneapi.exe zip
          package_platform windows-arm64 oneapi.exe zip
          package_platform macos-amd64 oneapi tar
          package_platform macos-arm64 oneapi tar

          ls -lh out
          (cd out && sha256sum *.tar.gz *.zip > SHA256SUMS)

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            out/*.tar.gz
            out/*.zip
            out/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
