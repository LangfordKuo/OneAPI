name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Ensure tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${version}"
            exit 1
          fi

  web:
    name: Build web assets
    needs: validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  build:
    name: Build ${{ matrix.platform }}
    needs:
      - validate
      - web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            platform: linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            platform: linux-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            platform: windows-amd64
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            platform: windows-arm64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            platform: macos-amd64
          - target: aarch64-apple-darwin
            os: macos-15
            platform: macos-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          cp "target/${{ matrix.target }}/release/oneapi" package/
          cp README.md LICENSE .env.example package/
          chmod +x package/oneapi
          tar -czf "oneapi-${GITHUB_REF_NAME}-${{ matrix.platform }}.tar.gz" -C package .
          ls -lh "oneapi-${GITHUB_REF_NAME}-${{ matrix.platform }}.tar.gz"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/oneapi.exe" package/
          Copy-Item README.md, LICENSE, .env.example package/
          Compress-Archive -Path package/* -DestinationPath "oneapi-${env:GITHUB_REF_NAME}-${{ matrix.platform }}.zip"
          Get-Item "oneapi-${env:GITHUB_REF_NAME}-${{ matrix.platform }}.zip" | Format-List

      # archive: false keeps the final .tar.gz/.zip as the artifact itself so the
      # Actions artifact and GitHub Release asset are not zipped a second time.
      - uses: actions/upload-artifact@v7
        with:
          name: oneapi-${{ matrix.platform }}
          path: oneapi-*
          archive: false
          if-no-files-found: error

  docker:
    name: Docker (linux/amd64, linux/arm64)
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: oneapi-*-linux-*
          path: docker-artifacts
          merge-multiple: true

      - name: Extract Linux release binaries
        run: |
          set -euo pipefail
          mkdir -p docker-context/amd64 docker-context/arm64
          tar -xzf docker-artifacts/oneapi-*-linux-amd64.tar.gz -C docker-context/amd64
          tar -xzf docker-artifacts/oneapi-*-linux-arm64.tar.gz -C docker-context/arm64
          chmod +x docker-context/amd64/oneapi docker-context/arm64/oneapi
          file docker-context/amd64/oneapi docker-context/arm64/oneapi

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate
      - build
      - docker
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum *.tar.gz *.zip > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
